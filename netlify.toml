# netlify.toml
# Place ce fichier à la racine de ton dépôt GitHub (celui qui sert déjà ciq.13080.fr).

[build]
  # Si ton site est déjà du HTML/CSS statique à la racine du dépôt, laisse vide.
  # Si tu as un dossier de sortie (ex: "dist", "public", "_site"), indique-le ici.
  publish = "."

[[edge_functions]]
  function = "ai-bot-tracker"
  path = "/*"
