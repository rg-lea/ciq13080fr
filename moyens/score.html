    if (!libPromises[src]) {

        var s = document.createElement("script");

        s.onload = resolve;
        s.onerror = function () { delete libPromises[src]; reject(new Error("Chargement impossible : " + src)); };

  }

  var ICON_DL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';

  function filtered() {

      if (filters.score && d.score !== filters.score) return false;

  function statCard(title, list, defs, key) {
    var n = list.length;
    var rows = Object.keys(defs).map(function (k) {
      var c = list.filter(function (d) { return d[key] === k; }).length;
      var pct = n ? Math.round(c * 100 / n) : 0;
      return '<div class="ls-stat__row"><span class="ls-stat__label"><span class="ls-stat__dot" style="background:' + defs[k].fill + '"></span>' + esc(defs[k].label) + '</span>' +
        '<span class="ls-stat__track" role="img" aria-label="' + esc(defs[k].label) + ' : ' + pct + ' %"><span class="ls-stat__fill" style="width:' + pct + '%;background:' + defs[k].fill + '"></span></span>' +
        '<span class="ls-stat__pct">' + pct + ' %</span></div>';
    }).join("");
    return '<div class="ls-card ls-stat"><h2>' + esc(title) + '<small>(' + n + ' dossier' + (n > 1 ? 's' : '') + ')</small></h2>' + rows + '</div>';
  }

    document.getElementById("ls-pdf").disabled = !list.length;

    res.innerHTML = sortThemes(Object.keys(groups)).map(function (t) {
      return '<section class="ls-group" aria-label="' + esc(t) + '"><h2 class="eyebrow">' + esc(t) + '</h2><div class="ls-list">' +

            '<div class="ls-row__meta">' + esc(themeOf(d)) + ' · Mis à jour le ' + esc(fmtShort(d.updated_date)) + '</div></a>';
        }).join("") + '</div></section>';

  }

  /* ---------- Vue 2 : fiche ---------- */
  function followKey(d) { return "ciqlea_interet_" + d.slug; }

  function renderDetail(d) {
    var meta = [esc(themeOf(d))];

    var secs = [];

    if (d.current_situation) secs.push(sec("Situation en cours", '<p class="ls-text">' + esc(d.current_situation) + '</p>'));
    if (d.next_steps && d.next_steps.length) secs.push(sec("Prochaines étapes", '<ul class="ls-checks">' +
      d.next_steps.map(function (s) {

      }).join("") + '</ul>'));

      }).join("") + '</ol>'));
    if (d.intervenants && d.intervenants.length) secs.push(sec("Intervenants impliqués", '<div class="ls-chips">' +

    app.innerHTML =
      '<a class="ls-back" href="#/">← Tous les dossiers</a>' +
      '<article class="ls-card ls-detail">' +
        '<header class="ls-hero">' +
          '<span class="eyebrow eyebrow--on-navy">Luynes\'Score</span>' +
          '<div class="ls-badges">' + badges(d) + '</div>' +
          '<div class="ls-hero__top"><h1>' + esc(d.name) + '</h1>' +
            '<button type="button" class="btn btn--primary ls-follow" id="ls-follow" aria-pressed="false" title="Indique au CIQ Luynes en action que ce dossier vous intéresse. Aucune inscription, aucun envoi d\'e-mail."></button></div>' +
          '<div class="ls-hero__meta">' + meta.join(" · ") + '</div>' +

      '</div>';

    var btn = document.getElementById("ls-follow");
    function paint() {
      var on = store(followKey(d)) === "1";
      btn.classList.toggle("is-on", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.textContent = on ? "✓ Intérêt noté, merci" : "Ce dossier m'intéresse";
    }
    paint();

      var on = store(followKey(d)) === "1";
      if (on) {
        store(followKey(d), null);
        track("trackEvent", "Dossiers", "Intérêt retiré", d.name);
      } else {

  function sec(title, html) { return '<section class="ls-sec"><h2>' + esc(title) + '</h2>' + html + '</section>'; }

  /* ---------- Routeur ---------- */
  var firstRoute = true;
  function route() {
    var m = location.hash.match(/^#\/dossier\/([^\/?#]+)/);
    var wasList = !!document.getElementById("ls-results");
    if (m) {
      if (wasList) lastListScroll = window.scrollY;
      var slug = decodeURIComponent(m[1]);
      var d = DOSSIERS.filter(function (x) { return x.slug === slug; })[0];
      if (!d) {
        document.title = "Dossier introuvable | " + SITE_TITLE;
        app.innerHTML = '<a class="ls-back" href="#/">← Tous les dossiers</a><div class="ls-card ls-notfound">Ce dossier n\'existe pas ou a été retiré.</div>';
      } else {
        document.title = d.name + " | " + SITE_TITLE;
        renderDetail(d);
        track("trackEvent", "Dossiers", "Consultation", d.name);
      }
      scrollToApp();
    } else {
      document.title = LIST_TITLE;
      renderListShell();
      if (!firstRoute) window.scrollTo(0, lastListScroll);
    }
    // Page vue « virtuelle » dans Matomo pour chaque changement de vue (la première est envoyée par le code Matomo de la page).
    if (!firstRoute) {
      track("setCustomUrl", location.href);
      track("setDocumentTitle", document.title);
      track("trackPageView");
    }
    firstRoute = false;
  }
  function scrollToApp() {
    if (firstRoute) return;
    var top = app.getBoundingClientRect().top + window.scrollY - 16;
    window.scrollTo(0, Math.max(0, top));
  }

  /* ---------- Export Excel (ExcelJS, aux couleurs du site) ---------- */
  function argb(hex) { return "FF" + hex.replace("#", "").toUpperCase(); }
  function exportXlsx(list, btn) {
    if (!list.length) return;
    btn.disabled = true;
    loadScript(LIB.xlsx).then(function () {
      var wb = new window.ExcelJS.Workbook();
      wb.creator = "CIQ Luynes en action";
      var ws = wb.addWorksheet("Dossiers", { views: [{ state: "frozen", ySplit: 1 }] });
      ws.columns = [
        { header: "Nom", key: "name", width: 44 },
        { header: "Slug", key: "slug", width: 36 },
        { header: "Thème", key: "theme", width: 24 },
        { header: "État", key: "status", width: 10 },
        { header: "Score", key: "score", width: 9 },
        { header: "Tendance", key: "trend", width: 15 },
        { header: "Année de début", key: "year", width: 15 },
        { header: "Intérêts", key: "followers", width: 10 },
        { header: "Description", key: "desc", width: 70 },
        { header: "Situation en cours", key: "situation", width: 70 },
        { header: "Intervenants", key: "iv", width: 40 }
      ];
      var FONT = "Outfit", NAVY = argb("#242E63"), LINE = { style: "thin", color: { argb: "FFDCDEE7" } };
      list.forEach(function (d) {
        ws.addRow({
          name: d.name, slug: d.slug, theme: themeOf(d), status: STATUS[d.status].label, score: d.score,
          trend: TREND[d.tendance].label, year: d.start_year || "", followers: d.followers || 0,
          desc: d.description || "", situation: d.current_situation || "", iv: (d.intervenants || []).join(", ")
        });
      });
      ws.eachRow(function (row, i) {
        row.eachCell({ includeEmpty: true }, function (c) {
          c.font = { name: FONT, size: 11, color: { argb: NAVY } };
          c.alignment = { vertical: "top", wrapText: true };
          c.border = { bottom: LINE };
        });
        if (i === 1) {
          row.height = 24;
          row.eachCell(function (c) {
            c.font = { name: FONT, size: 11, bold: true, color: { argb: "FFFFFFFF" } };
            c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: NAVY } };
            c.alignment = { vertical: "middle" };
            c.border = { bottom: { style: "medium", color: { argb: argb("#AD8901") } } };
          });
          return;
        }
        var d = list[i - 2];
        row.getCell("name").font = { name: FONT, size: 11, bold: true, color: { argb: NAVY } };
        var sc = SCORE[d.score], tr = TREND[d.tendance];
        var cs = row.getCell("score");
        cs.fill = { type: "pattern", pattern: "solid", fgColor: { argb: argb(sc.fill) } };
        cs.font = { name: FONT, size: 11, bold: true, color: { argb: argb(sc.on) } };
        cs.alignment = { vertical: "top", horizontal: "center" };
        row.getCell("trend").font = { name: FONT, size: 11, bold: true, color: { argb: argb(tr.ink) } };
        row.getCell("status").font = { name: FONT, size: 11, bold: true, color: { argb: argb(STATUS[d.status].ink) } };
        row.getCell("year").alignment = row.getCell("followers").alignment = { vertical: "top", horizontal: "center" };
      });
      ws.autoFilter = { from: "A1", to: "K1" };
      return wb.xlsx.writeBuffer();
    }).then(function (buf) {
      if (!buf) return;
      var blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "luynes-score-dossiers-" + isoToday() + ".xlsx";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      track("trackEvent", "Dossiers", "Export Excel", list.length === 1 ? list[0].name : list.length + " dossiers");
    }).catch(function () {
      toast("Le téléchargement n'a pas pu être préparé. Réessayez dans un instant.");
    }).then(function () { btn.disabled = false; });
  }

  function dossierBlocks(d) {
    var b = [];
    var meta = [esc(themeOf(d))];
    if (d.start_year) meta.push("Depuis " + esc(d.start_year));
    b.push('<div><div class="pdf-rule"></div><div class="pdf-eyebrow">Luynes\'Score · CIQ Luynes en action</div>' +
      '<h1 class="pdf-name">' + esc(d.name) + '</h1>' +
      '<div class="pdf-meta">' + meta.join(" · ") + '</div>' +
      '<div class="pdf-badges">' + pill(STATUS[d.status]) + pill(SCORE[d.score]) + pill(TREND[d.tendance]) + '</div>' +
      '<div class="pdf-sep"></div></div>');
    function section(title, items) {
      if (!items.length) return;
      // Le titre reste attaché au premier élément.
      b.push('<div><div class="pdf-h">' + esc(title) + '</div>' + items[0] + '</div>');
      for (var i = 1; i < items.length; i++) b.push(items[i]);
    }
    function paras(txt) {
      return String(txt || "").split(/\n+/).filter(function (x) { return x.trim(); })
        .map(function (x) { return '<p class="pdf-p">' + esc(x) + '</p>'; });
    }
    section("Description", paras(d.description));
    section("Situation en cours", paras(d.current_situation));
    section("Prochaines étapes", (d.next_steps || []).map(function (s) {
      return '<div class="pdf-item"><b style="color:' + (s.done ? "#3E8E63" : MUTED) + '">' + (s.done ? "✓" : "○") + '</b><span' +
        (s.done ? ' style="text-decoration:line-through;color:' + MUTED + '"' : '') + '>' + esc(s.text) + '</span></div>';
    }));
    section("Actions déjà mises en place", (d.actions_done || []).map(function (a) {
      return '<div class="pdf-item"><b style="color:' + GOLD_DARK + '">✓</b><span>' + esc(a.text) + '</span></div>';
    }));
    section("Historique des décisions", (d.decision_history || []).map(function (h) {
      return '<div class="pdf-hist"><b>' + esc(fmtNum(h.date)) + '</b><span>' + esc(h.text) + '</span></div>';
    }));
    if (d.intervenants && d.intervenants.length)
      section("Intervenants impliqués", ['<div class="pdf-chips">' + d.intervenants.map(function (i) { return '<span class="pdf-chip">' + esc(i) + '</span>'; }).join("") + '</div>']);
    return b;
  }

  function layoutDossier(stage, d) {
    var foot = "Mis à jour le " + fmtShort(d.updated_date);
    var pages = [];
    var page = newPage(stage, foot), box = page.firstChild;
    pages.push(page);
    dossierBlocks(d).forEach(function (html) {
      var node = el(html);
      box.appendChild(node);
      if (box.scrollHeight > box.clientHeight + 1 && box.children.length > 1) {
        box.removeChild(node);
        page = newPage(stage, foot); box = page.firstChild; pages.push(page);
        box.appendChild(el('<div class="pdf-cont">' + esc(d.name) + ' (suite)</div>'));
        box.appendChild(node);
      }
    });
    return pages;
  }

  function layoutCover(stage, list, now) {
    var count = function (f) { return list.filter(f).length; };
    var p = newPage(stage, "Édité le " + fmtNum(isoToday()));
    p.firstChild.remove();
    p.insertBefore(el('<div class="pdf-cover-band"><div class="pdf-cover-band__in">' +
      '<div class="pdf-cover__org">CIQ Luynes en action</div><div class="pdf-cover__rule"></div></div></div>'), p.firstChild);
    p.insertBefore(el('<div class="pdf-cover">' +
      '<div class="pdf-cover__brand">Rapport des dossiers</div>' +
      '<h1 class="pdf-cover__title">Luynes\'Score</h1>' +
      '<div class="pdf-cover__sub">L\'avancement des dossiers suivis par le CIQ Luynes en action</div>' +
      '<div class="pdf-cover__date">Édité le ' + fmtLong(now) + '</div>' +
      '<div class="pdf-cover__stats">' +
        stat(list.length, "Total", NAVY) +
        stat(count(function (d) { return d.status === "open"; }), "Ouverts", NAVY) +
        stat(count(function (d) { return d.score === "A"; }), "Score A", SCORE.A.ink) +
        stat(count(function (d) { return d.score === "C"; }), "Score C", SCORE.C.ink) +
      '</div>' +
      '<div class="pdf-cover__url">ciq.13080.fr/moyens/score</div></div>'), p.lastChild);
    return p;
    function stat(n, l, c) { return '<div class="pdf-cover__stat"><div class="pdf-cover__num" style="color:' + c + '">' + n + '</div><div class="pdf-cover__lbl">' + l + '</div></div>'; }
  }

  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.all(["400 12px Outfit", "500 12px Outfit", "600 12px Outfit", "700 12px Outfit"].map(function (f) {
      return document.fonts.load(f).catch(function () {});
    })).then(function () { return document.fonts.ready; });
  }

  function exportPdf(list, btn) {
    if (!list.length) return;
    var label = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = ICON_DL + "Préparation…";
    var stage = document.createElement("div");
    stage.className = "ls-pdf-stage";
    stage.setAttribute("aria-hidden", "true");
    stage.innerHTML = "<style>" + PDF_CSS + "</style>";
    document.body.appendChild(stage);

    Promise.all([loadScript(LIB.jspdf), loadScript(LIB.h2c), fontsReady()]).then(function () {
      var now = new Date();
      var pages = [];
      if (list.length > 1) pages.push(layoutCover(stage, list, now));
      list.forEach(function (d) { pages = pages.concat(layoutDossier(stage, d)); });
      pages.forEach(function (p, i) { p.querySelector(".pdf-num").textContent = "Page " + (i + 1) + " sur " + pages.length; });

      var pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4", compress: true });
      var chain = Promise.resolve();
      pages.forEach(function (p, i) {
        chain = chain.then(function () {
          btn.innerHTML = ICON_DL + "Page " + (i + 1) + " / " + pages.length;
          return window.html2canvas(p, { scale: 2, backgroundColor: "#ffffff", width: PAGE_W, height: PAGE_H, windowWidth: PAGE_W, logging: false, useCORS: true });
        }).then(function (canvas) {
          if (i > 0) pdf.addPage("a4", "portrait");
          pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 210, 297);
          canvas.width = canvas.height = 0;
        });
      });
      return chain.then(function () {
        pdf.setProperties({ title: "Luynes'Score : rapport des dossiers de quartier", author: "CIQ Luynes en action" });
        pdf.save("luynes-score-rapport-" + isoToday() + ".pdf");
        track("trackEvent", "Dossiers", "Export PDF", list.length === 1 ? list[0].name : list.length + " dossiers");
      });
    }).catch(function () {
      toast("Le PDF n'a pas pu être généré. Réessayez dans un instant.");
    }).then(function () {
      stage.remove();
      btn.disabled = false;
      btn.innerHTML = label;
    });
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>

</body>
</html>
